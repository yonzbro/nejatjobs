name: scraper

on:
  schedule:
    - cron: "17 5,11,17 * * *"  # UTC → TR 08:17, 14:17, 20:17 (dakika 17: saat başı yoğunluğundan kaçınır)
  workflow_dispatch: {}          # Actions sekmesinden elle çalıştırma

permissions:
  contents: read                 # GITHUB_TOKEN yalnızca okuyabilir

concurrency:
  group: scraper                 # aynı anda tek çalışma
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      # Action'lar tag değil commit SHA ile sabitlenir: tag sonradan değiştirilse bile kod değişmez
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # token .git/config'te kalmaz
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt

      # Her çalışmada güvenlik testleri; RLS bozulursa scraper hiç çalışmaz
      - name: Security tests
        run: python -m pytest -q
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      # Secret key yalnızca bu adıma verilir (en az yetki)
      - name: Scrape & store
        run: python main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
